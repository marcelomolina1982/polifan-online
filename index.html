<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ec2c7c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tu Vida En Tinta" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Tu Vida En Tinta · Polifan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if('serviceWorker' in navigator){
        window.addEventListener('load',async()=>{
          try{
            const build='25.0.33'
            const r=await navigator.serviceWorker.register('/sw.js?v='+build,{updateViaCache:'none'})
            await r.update()
            const reloadKey='sw-reloaded-'+build
            navigator.serviceWorker.addEventListener('controllerchange',()=>{
              if(!sessionStorage.getItem(reloadKey)){
                sessionStorage.setItem(reloadKey,'1')
                location.reload()
              }
            })
            if(r.waiting)r.waiting.postMessage?.({type:'SKIP_WAITING'})
          }catch(e){console.warn('SW update',e)}
        })
      }
    </script>
  </body>
</html>
