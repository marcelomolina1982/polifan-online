name: Fetch Sparrow WASM assets
on:
  push:
    branches: [automation-sparrow-assets]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned Sparrow browser assets
        run: |
          mkdir -p sparrow-assets
          base='https://raw.githubusercontent.com/JeroenGar/sparroWASM/gh-pages/assets'
          curl -fL "$base/sparroWASM-WUwBRWrA.js" -o sparrow-assets/sparroWASM-WUwBRWrA.js
          curl -fL "$base/sparroWASM_bg-BMD11AKQ.wasm" -o sparrow-assets/sparroWASM_bg-BMD11AKQ.wasm
          curl -fL "$base/workerHelpers-CxQXXpBt.js" -o sparrow-assets/workerHelpers-CxQXXpBt.js
          curl -fL "$base/algorithmWorker-BE3dlI69.js" -o sparrow-assets/algorithmWorker-BE3dlI69.js
          sha256sum sparrow-assets/* | tee sparrow-assets/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sparrow-wasm-assets
          path: sparrow-assets
          retention-days: 1
