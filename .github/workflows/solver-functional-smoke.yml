name: Functional solver smoke test
on:
  push:
    branches: ['test/solver-functional-20261024']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r solver-service/requirements.txt
      - name: Exercise actual production packing call
        working-directory: solver-service
        run: |
          python - <<'PY'
          from app import solve_prefix
          svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="0" y="0" width="100" height="100"/></svg>'
          kits=[{'kitId':'smoke-1','figure':'Rectangulo','parts':[{'instanceId':'part-1','name':'Base','role':'base','svgText':svg,'sourceWidthCm':10,'sourceHeightCm':10,'allowRotate':False}]}]
          result=solve_prefix(kits,1,580,1220,3,10,rotation_step=90)
          assert result and result.get('feasible'), f'Packing failed: {result}'
          assert result.get('target')==1, result
          assert len(result.get('placements',[]))==1, result
          print('Real packing test OK:',result['placements'])
          PY
