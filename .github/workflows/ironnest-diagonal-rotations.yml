name: IronNest diagonal rotations experimental

on:
  pull_request:
    branches: [motor-ironnest-hardbound-lab]
    paths:
      - 'solver-service/ironnest_benchmark_app.py'
      - 'solver-service/test_ironnest_diagonal_rotations.py'
      - 'solver-service/benchmark_ironnest_angles.py'
      - '.github/workflows/ironnest-diagonal-rotations.yml'

permissions:
  contents: read

jobs:
  verify-diagonal-option:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Python syntax
        run: python -m py_compile solver-service/ironnest_benchmark_app.py
      - name: Verify rotation sets and unchanged normal mode
        run: python solver-service/test_ironnest_diagonal_rotations.py
      - name: Install real IronNest engine
        run: python -m pip install --disable-pip-version-check ironnest==0.6.2 shapely==2.1.2
      - name: Benchmark 4 vs 8 rotations on synthetic parts
        run: python -u solver-service/benchmark_ironnest_angles.py
