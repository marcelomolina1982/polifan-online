name: Fix past orders inventory
on:
  push:
    paths:
      - '.inventory-past-orders-fix-trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch inventory consumption
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/inventory.js')
          s=p.read_text()
          old="export function isOrderAutomaticallyOut(order,today=todayArgentinaISO()){if(!order||order.status==='Cancelado')return false;return order.status==='Entregado'}"
          new="export function isOrderAutomaticallyOut(order,today=todayArgentinaISO()){if(!order||order.status==='Cancelado')return false;const date=orderDate(order);return order.status==='Entregado'||Boolean(date&&date<today)}"
          if old not in s:
              raise SystemExit('Expected inventory function not found; aborting safely')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/inventory.js
          git diff --cached --quiet && exit 0
          git commit -m "fix inventory consume expired orders"
          git push