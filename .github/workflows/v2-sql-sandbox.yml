name: V2 SQL aislado (sin acceso a produccion)

on:
  pull_request:
    paths:
      - 'scripts/patch-v2-*-DRAFT.sql'
      - 'scripts/generate-v2-*-sandbox.mjs'
      - 'scripts/fixtures/patch-v2-original-reference.sql'
      - '.github/workflows/v2-sql-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-postgresql:
    name: Probar SQL real con PostgreSQL 17 y ROLLBACK
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sandbox
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: sandbox_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandbox -d sandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar transacciones de prueba desde el SQL verdadero
        run: |
          node scripts/generate-v2-durable-sandbox.mjs > /tmp/v2-durable.sql
          node scripts/generate-v2-set-based-sandbox.mjs > /tmp/v2-setbased.sql
          node scripts/generate-v2-inventory-scale-sandbox.mjs > /tmp/v2-scale.sql
          node scripts/generate-v2-normalized-ids-sandbox.mjs > /tmp/v2-ids.sql
          for file in /tmp/v2-*.sql; do
            grep -Eq '^rollback;$' "$file"
            if grep -Eiq '(insert into|update|delete from|alter table|drop table)[[:space:]]+public\.(app_state|app_state_section_revisions)' "$file"; then
              echo "ERROR: acceso de escritura a tabla productiva en $file"
              exit 1
            fi
          done
      - name: Ejecutar las 4 pruebas en PostgreSQL 17 independiente
        run: |
          for name in durable setbased scale ids; do
            echo "== Test: $name =="
            docker run --rm --network host \
              -e PGPASSWORD=sandbox_only \
              -v /tmp:/sandbox:ro \
              postgres:17-alpine \
              psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 \
                -U sandbox -d sandbox -f "/sandbox/v2-$name.sql"
          done
      - name: Confirmar que las pruebas no dejaron tablas permanentes
        run: |
          docker run --rm --network host -e PGPASSWORD=sandbox_only \
            postgres:17-alpine \
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sandbox -d sandbox \
              -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('app_state','app_state_section_revisions')" | grep -qx 0

      - name: Dos sesiones simultaneas, misma revision CAS
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-v2-concurrency-sandbox.mjs > /tmp/v2-concurrent-init.sql
          docker run --rm --network host -e PGPASSWORD=sandbox_only -v /tmp:/sandbox:ro \
            postgres:17-alpine psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 \
            -U sandbox -d sandbox -f /sandbox/v2-concurrent-init.sql

          cat > /tmp/v2-writer-a.sql <<'SQL'
          BEGIN;
          SELECT * FROM sandbox_concurrency.patch_v2_sections_cas(
            '{"movements":[{"id":"m1","qty":2}]}'::jsonb,
            '{"movements":"2026-11-20T10:00:00Z"}'::jsonb,
            '11111111-1111-4111-8111-111111111111'::uuid);
          SELECT pg_sleep(2);
          COMMIT;
          SQL

          cat > /tmp/v2-writer-b.sql <<'SQL'
          SELECT * FROM sandbox_concurrency.patch_v2_sections_cas(
            '{"movements":[{"id":"m1","qty":3}]}'::jsonb,
            '{"movements":"2026-11-20T10:00:00Z"}'::jsonb,
            '11111111-1111-4111-8111-111111111111'::uuid);
          SQL

          docker run --rm --network host -e PGPASSWORD=sandbox_only -v /tmp:/sandbox:ro \
            postgres:17-alpine psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 \
            -U sandbox -d sandbox -f /sandbox/v2-writer-a.sql > /tmp/v2-a.log 2>&1 &
          writer_a=$!
          sleep 1
          set +e
          docker run --rm --network host -e PGPASSWORD=sandbox_only -v /tmp:/sandbox:ro \
            postgres:17-alpine psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 \
            -U sandbox -d sandbox -f /sandbox/v2-writer-b.sql > /tmp/v2-b.log 2>&1
          status_b=$?
          set -e
          wait "$writer_a"
          if [ "$status_b" -eq 0 ]; then
            echo "ERROR: dos versiones incompatibles guardaron la misma revision"
            exit 1
          fi
          grep -q 'Conflicto de sincronización' /tmp/v2-b.log
          docker run --rm --network host -e PGPASSWORD=sandbox_only \
            postgres:17-alpine psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 \
            -U sandbox -d sandbox -Atc \
            "select data #>> '{item,qty}' from sandbox_concurrency.app_state where id='movement_m1'" | grep -qx 2
          echo "OK: la segunda PC no pudo sobreescribir el movimiento guardado por la primera"
