name: Motor Lab internal tests
on:
  push:
    branches: [lab/internal-tests-motor]
  workflow_dispatch:

jobs:
  motor-internal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install 'Flask>=3,<4' 'shapely>=2,<3'
      - name: Build real Sparrow binary
        run: |
          git clone --depth 1 https://github.com/JeroenGar/sparrow.git /tmp/sparrow
          cd /tmp/sparrow
          cargo build --release --features only_final_svg --bin sparrow
          cp target/release/sparrow /tmp/sparrow-bin
      - name: Run serious motor regression + real Sparrow integration
        working-directory: solver-service
        env:
          SPARROW_BIN_TEST: /tmp/sparrow-bin
        run: python -m unittest discover -s tests -v
