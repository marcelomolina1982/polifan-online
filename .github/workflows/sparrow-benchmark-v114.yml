name: Sparrow V1.14 benchmark 12

on:
  push:
    branches:
      - bench/sparrow-v114-run2
    paths:
      - 'solver-service/benchmarks/**'
      - '.github/workflows/sparrow-benchmark-v114.yml'
  pull_request:
    branches:
      - bench/sparrow-v114-base
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build official Sparrow
        run: |
          git clone --depth 1 https://github.com/JeroenGar/sparrow.git /tmp/sparrow
          cd /tmp/sparrow
          cargo build --release --features only_final_svg --bin sparrow
          cp target/release/sparrow /tmp/sparrow-bin

      - name: Stress known 12-complete geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runs
          FIX="$GITHUB_WORKSPACE/solver-service/benchmarks/polifan_benchmark_12.json"
          seeds=(101 307 911 1701 4099 7919 12011 31337)
          echo 'seed,exit,placed,width_mm,success' > /tmp/results.csv
          best=999999
          wins=0

          for seed in "${seeds[@]}"; do
            d="/tmp/runs/$seed"
            mkdir -p "$d"
            cd "$d"

            set +e
            timeout 30s /tmp/sparrow-bin -i "$FIX" -t 12 --min-item-separation 2.5 --workers 1 -s "$seed" > run.log 2>&1
            code=$?
            set -e

            out="$d/output/final_polifan.json"
            if [ -f "$out" ]; then
              placed=$(python3 -c "import json,sys; p=json.load(open(sys.argv[1])); s=p.get('solution') or {}; print(len(((s.get('layout') or {}).get('placed_items') or [])))" "$out")
              width=$(python3 -c "import json,sys; p=json.load(open(sys.argv[1])); s=p.get('solution') or {}; print(float(s.get('strip_width') or 999999))" "$out")
            else
              placed=0
              width=999999
            fi

            success=0
            if [ "$placed" -eq 24 ] && python3 -c "import sys; sys.exit(0 if float(sys.argv[1]) <= 1214.0 else 1)" "$width"; then
              success=1
              wins=$((wins+1))
            fi

            best=$(python3 -c "import sys; print(min(float(sys.argv[1]),float(sys.argv[2])))" "$best" "$width")
            echo "$seed,$code,$placed,$width,$success" | tee -a /tmp/results.csv
          done

          echo "wins=$wins" | tee /tmp/summary.txt
          echo "best_width_mm=$best" | tee -a /tmp/summary.txt
          echo '--- RESULTS ---'
          cat /tmp/results.csv
          echo '--- SUMMARY ---'
          cat /tmp/summary.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparrow-v114-benchmark-results
          path: |
            /tmp/results.csv
            /tmp/summary.txt
            /tmp/runs/*/run.log
            /tmp/runs/*/output/final_polifan.json
            /tmp/runs/*/output/final_polifan.svg
          if-no-files-found: warn
