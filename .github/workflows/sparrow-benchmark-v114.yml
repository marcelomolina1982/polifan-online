name: Sparrow V1.14 benchmark 12

on:
  push:
    branches:
      - bench/sparrow-v114-run2
  pull_request:
    branches:
      - bench/sparrow-v114-base
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build official Sparrow
        run: |
          git clone --depth 1 https://github.com/JeroenGar/sparrow.git /tmp/sparrow
          cd /tmp/sparrow
          cargo build --release --features only_final_svg --bin sparrow
          cp target/release/sparrow /tmp/sparrow-bin

      - name: Stress overloaded selection 13 and 14 candidate figures
        run: |
          python3 solver-service/benchmarks/selection_stress.py | tee /tmp/selection.log

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparrow-v115-selection-stress
          path: |
            /tmp/selection.log
            /tmp/selection_summary.json
          if-no-files-found: warn
