name: Sparrow V1.14 benchmark 12

on:
  push:
    branches:
      - bench/focused-case5-clean
  pull_request:
    branches:
      - bench/sparrow-v114-base
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build official Sparrow
        run: |
          git clone --depth 1 https://github.com/JeroenGar/sparrow.git /tmp/sparrow
          cd /tmp/sparrow
          cargo build --release --features only_final_svg --bin sparrow
          cp target/release/sparrow /tmp/sparrow-bin
      - name: Intense focused search for case 9
        shell: bash
        run: |
          set -euo pipefail
          python3 solver-service/benchmarks/multimodel_stress.py | tee /tmp/multimodel_console.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparrow-case9-target-results
          path: |
            /tmp/multimodel_summary.json
            /tmp/multimodel_rows.json
            /tmp/multimodel_console.txt
            /tmp/multimodel_case*.log
            /tmp/case9_best_checkpoint.json
            /tmp/case9_best.svg
          if-no-files-found: warn
      - name: Publish benchmark summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Sparrow case 9 benchmark result\n\n';
            try {
              const raw = fs.readFileSync('/tmp/multimodel_summary.json', 'utf8');
              const s = JSON.parse(raw);
              body += `- Adaptive solved: **${s.adaptive_cases_solved}/${s.cases}** (${s.adaptive_success_rate}%)\n`;
              body += `- Best width: **${s.best_width} mm**\n`;
              body += `- Physical plate: **${s.physical_plate_mm?.join(' × ')} mm**\n`;
              body += `- Certifiable bbox: **${s.certifiable_bbox_mm?.join(' × ')} mm**\n`;
              body += `- Minimum separation: **${s.minimum_separation_mm} mm**\n`;
              body += `- Width goal reached: **${s.width_goal_reached}**\n\n`;
              body += '### Cases\n';
              for (const c of (s.case_results || [])) {
                body += `- Case ${c.case}: adaptive=${c.solved} best=${c.best_width} mm attempts=${c.attempts}\n`;
              }
              body += `\n<details><summary>Raw SUMMARY</summary>\n\n\`\`\`json\n${JSON.stringify(s,null,2)}\n\`\`\`\n</details>`;
            } catch (e) {
              body += `Benchmark did not produce a readable summary: ${e.message}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
