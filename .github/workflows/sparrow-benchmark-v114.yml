name: Sparrow V1.14 benchmark 12

on:
  push:
    branches:
      - lab/sparrow-v114-global-human-search
      - bench/sparrow-v114-base
    paths:
      - 'solver-service/benchmarks/**'
      - '.github/workflows/sparrow-benchmark-v114.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build official Sparrow
        run: |
          git clone --depth 1 https://github.com/JeroenGar/sparrow.git /tmp/sparrow
          cd /tmp/sparrow
          cargo build --release --features only_final_svg --bin sparrow
          cp target/release/sparrow /tmp/sparrow-bin
      - name: Stress real multimodel orders
        shell: bash
        run: |
          set -euo pipefail
          python3 solver-service/benchmarks/multimodel_stress.py | tee /tmp/multimodel_console.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparrow-multimodel-results
          path: |
            /tmp/multimodel_summary.json
            /tmp/multimodel_rows.json
            /tmp/multimodel_console.txt
            /tmp/multimodel_case*.log
          if-no-files-found: warn
