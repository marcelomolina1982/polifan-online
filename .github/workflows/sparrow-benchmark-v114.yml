name: Sparrow V1.14 benchmark 12

on:
  pull_request:
    branches:
      - bench/sparrow-v114-base
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build official Sparrow
        run: |
          git clone --depth 1 https://github.com/JeroenGar/sparrow.git /tmp/sparrow
          cd /tmp/sparrow
          cargo build --release --features only_final_svg --bin sparrow
          cp target/release/sparrow /tmp/sparrow-bin
      - name: Stress real multimodel orders
        shell: bash
        run: |
          set -euo pipefail
          python3 solver-service/benchmarks/multimodel_stress.py | tee /tmp/multimodel_console.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparrow-multimodel-results
          path: |
            /tmp/multimodel_summary.json
            /tmp/multimodel_rows.json
            /tmp/multimodel_console.txt
            /tmp/multimodel_case*.log
          if-no-files-found: warn
      - name: Publish benchmark summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Sparrow benchmark result\n\n';
            try {
              const raw = fs.readFileSync('/tmp/multimodel_summary.json', 'utf8');
              const s = JSON.parse(raw);
              body += `- Official solved: **${s.official_cases_solved}/${s.cases}** (${s.official_success_rate}%)\n`;
              body += `- Adaptive solved: **${s.adaptive_cases_solved}/${s.cases}** (${s.adaptive_success_rate}%)\n`;
              body += `- Gain: **${s.adaptive_gain_cases} cases**\n`;
              body += `- Beats official: **${s.beats_official}**\n`;
              body += `- Best width: **${s.best_width} mm**\n`;
              body += `- Worst measured width: **${s.worst_width} mm**\n\n`;
              body += '### Cases\n';
              for (const c of (s.case_results || [])) {
                body += `- Case ${c.case}: official=${c.official_ok} adaptive=${c.solved} best=${c.best_width} mm strategy=${c.best_strategy} attempts=${c.attempts}\n`;
              }
              body += `\n<details><summary>Raw SUMMARY</summary>\n\n\`\`\`json\n${JSON.stringify(s,null,2)}\n\`\`\`\n</details>`;
            } catch (e) {
              body += `Benchmark did not produce a readable summary: ${e.message}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
