name: Apply component stock planning fix
on:
  push:
    branches: [fix-component-stock-planning-20260906]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-component-stock-planning-20260906
      - name: Apply fix
        run: python .github/scripts/apply-component-stock-fix.py
      - name: Validate build
        run: npm ci && npm run build
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/inventory.js src/pages/SheetPlanner.jsx
          git diff --cached --quiet || git commit -m "Aprovechar bases y tapas del inventario al planificar cortes"
          git push origin HEAD:fix-component-stock-planning-20260906
