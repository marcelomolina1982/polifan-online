name: Benchmark experimental IronNest 4 vs 8 angulos

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/benchmark_ironnest_angles.py'
      - '.github/workflows/ironnest-angles-sandbox.yml'
  push:
    branches: ['test/ironnest-diagonal-benchmark-isolated-20261126']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-rotations:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install solver in independent runner
        run: python -m pip install --disable-pip-version-check ironnest==0.6.2 shapely==2.1.2
      - name: Time real IronNest 4 and 8 rotations with identical synthetic parts
        run: python -u scripts/benchmark_ironnest_angles.py
