name: Validar build
on:
  push:
    branches:
      - main
      - app-v2-parallel
      - 'prebuild-v2-*'
  pull_request:
    branches:
      - main
      - app-v2-parallel
concurrency:
  group: validate-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
