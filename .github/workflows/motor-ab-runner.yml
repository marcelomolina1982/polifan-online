name: Motor A-B Runner

on:
  push:
    branches:
      - motor-complete-first-safe-20260909
    paths:
      - '.github/workflows/motor-ab-runner.yml'
      - 'solver-service/benchmark_runner/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-fixture-call:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call Complete First private fixture benchmark
        shell: bash
        run: |
          set -euo pipefail
          URL='https://polifan-motor-complete-first-ab.onrender.com/benchmark-private-fixture'
          for i in {1..8}; do
            code=$(curl -L -sS -o /tmp/result.json -w '%{http_code}' --connect-timeout 20 --max-time 600 "$URL" || true)
            echo "attempt=$i http=$code"
            if [ "$code" = '200' ]; then
              cat /tmp/result.json
              echo
              exit 0
            fi
            cat /tmp/result.json 2>/dev/null || true
            echo
            sleep 15
          done
          echo 'Private fixture benchmark call failed' >&2
          exit 1
