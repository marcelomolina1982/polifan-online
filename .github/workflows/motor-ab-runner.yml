name: Motor A-B Runner

on:
  push:
    branches:
      - motor-complete-first-safe-20260909
    paths:
      - '.github/workflows/motor-ab-runner.yml'
      - 'solver-service/benchmark_runner/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Complete First lab is reachable
        shell: bash
        run: |
          set -euo pipefail
          URL='https://polifan-motor-complete-first-ab.onrender.com/upload-benchmark'
          for i in {1..12}; do
            code=$(curl -L -sS -o /tmp/benchmark.html -w '%{http_code}' --connect-timeout 15 --max-time 60 "$URL" || true)
            if [ "$code" = '200' ]; then
              grep -q 'Prueba historica real' /tmp/benchmark.html
              echo 'COMPLETE_FIRST_LAB_REACHABLE=1'
              echo 'WORKSPACE=1220x580'
              echo 'SCALE=1:1'
              echo 'PREFERRED_GAP_MM=3.0'
              echo 'ABSOLUTE_MIN_GAP_MM=2.5'
              exit 0
            fi
            echo "attempt=$i http=$code"
            sleep 15
          done
          echo 'Complete First benchmark endpoint was not reachable/updated' >&2
          cat /tmp/benchmark.html 2>/dev/null || true
          exit 1

      - name: Prepare private-input directory
        run: |
          mkdir -p "$RUNNER_TEMP/polifan-benchmark-input"
          chmod 700 "$RUNNER_TEMP/polifan-benchmark-input"
          echo 'Runner listo. Los SVG no se almacenan en el repositorio.'
