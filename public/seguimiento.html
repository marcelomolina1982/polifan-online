<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Seguimiento de pedido · Tu Vida en Tinta</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182235;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fdf4f8 0,#f6f7fb 36%,#eef6ff 100%)}.wrap{max-width:760px;margin:auto;padding:28px 16px 48px}.card{background:#fff;border:1px solid #e7eaf0;border-radius:24px;box-shadow:0 18px 55px rgba(35,52,85,.10);overflow:hidden}.hero{padding:28px;background:linear-gradient(135deg,#fff1f6,#f4f2ff 55%,#eef8ff)}.brand{display:flex;gap:14px;align-items:center}.brand img{width:62px;height:62px;object-fit:contain;background:#fff;border-radius:18px;padding:6px}.brand small{display:block;font-weight:800;letter-spacing:.08em;color:#e13678}.brand h1{margin:2px 0 0;font-size:28px}.orderbox{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:rgba(255,255,255,.86);border-radius:16px;padding:13px}.mini small{display:block;color:#6f7a8d;font-weight:800;font-size:11px;text-transform:uppercase}.mini b{display:block;margin-top:4px;font-size:16px}.body{padding:28px}.current{border-radius:18px;padding:18px;background:#172f57;color:#fff;margin-bottom:24px}.current small{display:block;opacity:.72;font-weight:800}.current strong{display:block;font-size:26px;margin-top:3px}.current p{margin:8px 0 0;opacity:.9}.timeline{display:grid}.step{display:grid;grid-template-columns:38px 1fr;gap:12px;min-height:78px;position:relative}.step:not(:last-child):before{content:"";position:absolute;left:18px;top:34px;bottom:-4px;width:2px;background:#e1e5ed}.dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #d8dde7;background:#fff;color:#98a2b3;font-weight:900;z-index:1}.step.done .dot,.step.active .dot{background:#ef3d82;border-color:#ef3d82;color:#fff}.step.done:not(:last-child):before{background:#ef3d82}.label b{display:block;font-size:17px;margin-top:5px}.label span{display:block;color:#788396;margin-top:3px;line-height:1.35}.step.active .label b{color:#df2d73}.delivery{margin-top:22px;padding:16px;border-radius:16px;background:#f7f9fc;border:1px solid #e5e9f0}.delivery b{display:block;margin-bottom:4px}.delivery p{margin:0;color:#647085}.thanks{margin-top:18px;padding:20px;border-radius:18px;background:linear-gradient(135deg,#fff0f7,#f4efff 55%,#eef9ff);border:1px solid #eaddeb;text-align:center}.thanks h3{margin:0;font-size:21px}.thanks p{margin:8px auto 15px;max-width:520px;color:#667085;line-height:1.5}.review-btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:999px;background:#211827;color:#fff;text-decoration:none;font-weight:800;box-shadow:0 10px 28px rgba(33,24,39,.18)}.foot{text-align:center;color:#7c8799;font-size:13px;margin-top:20px}.loading,.error{text-align:center;padding:52px 22px}.spinner{width:44px;height:44px;border:4px solid #e7eaf0;border-top-color:#ef3d82;border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:620px){.wrap{padding:0}.card{border-radius:0;min-height:100vh}.hero,.body{padding:22px 18px}.brand h1{font-size:23px}.orderbox{grid-template-columns:1fr 1fr}.mini:last-child{grid-column:1/-1}}</style></head><body><div class="wrap"><main class="card" id="app"><div class="loading"><div class="spinner"></div><b>Cargando seguimiento…</b></div></main></div><script>
const SUPABASE_URL='https://eftksimpkkvmyfurwqii.supabase.co',SUPABASE_KEY='sb_publishable_RJheqVJ6VdJC7291e2z7WQ_0vsBsDWN';
const REVIEW_URL='https://tu-vida-en-tinta-catalogo-v2.vercel.app/opiniones';
const STEPS=['Agendado','En producción / corte','Para embalar','Despachado'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const niceDate=v=>{if(!v)return'A confirmar';const[y,m,d]=String(v).split('-');return`${d}/${m}/${y}`};
function normalizedStage(v){const s=String(v||'Agendado');if(s==='En producción'||s==='En corte'||s==='production_cut'||s==='production'||s==='cut')return'En producción / corte';if(s==='confirmed')return'Agendado';if(s==='packing')return'Para embalar';if(s==='dispatched'||s==='delivered'||s==='Entregado'||s==='Finalizado'||s==='ready_pickup'||s==='Listo para retirar')return'Despachado';return s}
function normalizeDelivery(v){const k=String(v||'').toLowerCase();if(k.includes('retiro'))return'Retiro en el local';if(k.includes('via cargo')||k.includes('vía cargo'))return'Vía Cargo';if(k.includes('otro'))return'Otro expreso';return'Logística GBA/CABA'}
function deliveryCopy(type,stage,agency){if(type==='Retiro en el local')return stage==='Despachado'?'Tu pedido ya está listo para retirar en el local.':'Cuando terminemos de embalarlo te avisaremos para que puedas retirarlo.';if(type==='Vía Cargo')return stage==='Despachado'?`Tu pedido ya fue despachado por Vía Cargo${agency?` · ${agency}`:''}.`:'Cuando sea despachado por Vía Cargo vas a ver el cambio reflejado acá.';return stage==='Despachado'?'Tu pedido ya salió de nuestro local y fue entregado al transporte.':'Cuando salga de nuestro local vas a ver el cambio reflejado acá.'}
function stageMessage(s){return({'Agendado':'Recibimos tu pedido y ya quedó agendado.','En producción / corte':'Estamos preparando y cortando las piezas de tu pedido.','Para embalar':'La producción terminó y estamos preparando el embalaje.','Despachado':'Tu pedido ya salió de nuestro local. ¡Gracias por elegirnos!','Cancelado':'Este pedido figura como cancelado.'})[s]||'Tu pedido está siendo actualizado.'}
function render(o){const type=normalizeDelivery(o.delivery_type),stage=normalizedStage(o.tracking_stage),current=stage==='Cancelado'?-1:Math.max(0,STEPS.indexOf(stage));const copy={'Agendado':'Pedido confirmado y reservado en nuestra agenda.','En producción / corte':'Estamos preparando y cortando las piezas.','Para embalar':'Revisión final y preparación de la caja.','Despachado':type==='Retiro en el local'?'Pedido listo para retirar.':'Pedido entregado al transporte.'};const steps=STEPS.map((s,i)=>`<div class="step ${i<current?'done':i===current?'active':''}"><div class="dot">${i<current?'✓':i+1}</div><div class="label"><b>${esc(s)}</b><span>${esc(copy[s])}</span></div></div>`).join('');const thanks=stage==='Despachado'?`<div class="thanks"><h3>💗 ¡Gracias por elegir Tu Vida en Tinta!</h3><p>Esperamos que disfrutes tu pedido. Si querés ayudarnos a seguir mejorando, contanos cómo fue tu experiencia. Tu opinión también ayuda a otras personas que están eligiendo sus diseños.</p><a class="review-btn" href="${REVIEW_URL}" target="_blank" rel="noreferrer">⭐ Dejar mi opinión</a></div>`:'';document.getElementById('app').innerHTML=`<section class="hero"><div class="brand"><img src="/logo-tu-vida-en-tinta.png"><div><small>TU VIDA EN TINTA</small><h1>Seguimiento de tu pedido</h1></div></div><div class="orderbox"><div class="mini"><small>Pedido</small><b>#${esc(o.order_number)}</b></div><div class="mini"><small>Cliente</small><b>${esc(o.customer_name||'-')}</b></div><div class="mini"><small>Fecha prevista</small><b>${esc(niceDate(o.delivery_date))}</b></div></div></section><section class="body"><div class="current"><small>ESTADO ACTUAL</small><strong>${esc(stage)}</strong><p>${esc(stageMessage(stage))}</p></div>${stage==='Cancelado'?'<div class="error"><h2>Pedido cancelado</h2><p>Si necesitás ayuda, comunicate con nosotros.</p></div>':`<div class="timeline">${steps}</div>`}<div class="delivery"><b>${esc(type)}</b><p>${esc(deliveryCopy(type,stage,o.agency_delivery))}</p></div>${thanks}<div class="foot">Última actualización: ${esc(new Date(o.updated_at).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}))}<br>Tu Vida en Tinta · José León Suárez, Buenos Aires</div></section>`}
async function boot(){const pathToken=location.pathname.match(/^\/p\/([^/]+)\/?$/)?.[1]||'',token=new URLSearchParams(location.search).get('t')||decodeURIComponent(pathToken);if(!token)return fail('Falta el código de seguimiento.');try{const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_order_tracking_v2`,{method:'POST',headers:{apikey:SUPABASE_KEY,'content-type':'application/json'},body:JSON.stringify({p_token:token})});if(!r.ok)throw new Error();const rows=await r.json();if(!rows?.length)return fail('No encontramos un pedido con ese enlace.');render(rows[0])}catch(e){fail('No pudimos cargar el seguimiento en este momento. Intentá nuevamente en unos minutos.')}}function fail(text){document.getElementById('app').innerHTML=`<div class="error"><h2>Seguimiento no disponible</h2><p>${esc(text)}</p></div>`}boot();
</script></body></html>
