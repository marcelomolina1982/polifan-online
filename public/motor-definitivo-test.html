<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motor Polifan Definitivo · Prueba</title><style>body{font-family:system-ui;background:#f6f7fb;margin:0;color:#18202a}.wrap{max-width:900px;margin:30px auto;padding:20px}.card{background:white;border:1px solid #dde2ea;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0001}h1{margin:0 0 8px}small{color:#677}.row{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}button,.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:#111827;color:white}input[type=file]{padding:10px;border:1px solid #ccd3dd;border-radius:12px;background:#fff}.status{padding:14px;border-radius:12px;background:#f3f4f6;white-space:pre-wrap}.ok{background:#dcfce7}.bad{background:#fee2e2}.warn{background:#fef3c7}a.btn{text-decoration:none;display:inline-block}</style></head><body><div class="wrap"><div class="card"><h1>Motor Polifan Definitivo V1.3</h1><small>Modo de prueba · placa 1220×580 mm · 3 mm preferido · 2,5 mm mínimo · certificación optimizada</small><div class="row"><input id="file" type="file" accept=".svg,image/svg+xml"><button id="run">Probar SVG</button></div><div id="status" class="status">Elegí una placa SVG histórica para probar.</div><div id="download" class="row"></div></div></div><script>const $=id=>document.getElementById(id);let outputUrl=null;$('run').onclick=async()=>{const f=$('file').files[0];if(!f)return alert('Elegí un SVG');$('status').className='status warn';$('status').textContent='Calculando…';$('download').innerHTML='';if(outputUrl)URL.revokeObjectURL(outputUrl);try{const svgText=await f.text();const r=await fetch('/api/motor-definitivo',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({filename:f.name,svgText})});const j=await r.json();const cert=String(j.status||'').startsWith('CERTIFICADO');$('status').className='status '+(cert?'ok':'bad');$('status').textContent=`${j.status||'ERROR'}\nMotor: ${j.engineVersion||j.engine||'-'}\nPiezas: ${j.pieces??'-'}\nSeparación búsqueda: ${j.search_gap_used_mm??'-'} mm\nSeparación mínima certificada: ${j.validation?.min_gap_mm??'-'} mm\nConflictos: ${j.validation?.conflicts??j.conflicts??'-'}\nBorde: ${j.validation?.border_conflicts??j.border_conflicts??'-'}\nTiempo: ${j.seconds??'-'} s`;if(cert&&j.svgText){outputUrl=URL.createObjectURL(new Blob([j.svgText],{type:'image/svg+xml'}));const a=document.createElement('a');a.className='btn';a.href=outputUrl;a.download=f.name.replace(/\.svg$/i,'')+'__POLIFAN_CERTIFICADO.svg';a.textContent='Descargar SVG certificado';$('download').appendChild(a)}}catch(e){$('status').className='status bad';$('status').textContent='Error: '+e.message}}</script></body></html>
