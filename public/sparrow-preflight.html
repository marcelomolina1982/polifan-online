<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sparrow WASM preflight</title><style>body{font-family:system-ui;background:#111827;color:#f9fafb;padding:24px}.card{max-width:760px;margin:auto;background:#1f2937;border-radius:16px;padding:22px}.ok{color:#86efac}.bad{color:#fca5a5}code{background:#0f172a;padding:3px 6px;border-radius:6px}</style></head><body><div class="card"><h1>Sparrow WASM · preflight</h1><p id="iso"></p><p id="sab"></p><p id="workers"></p><p>Este test no ejecuta el nesting: sólo confirma que Vercel entrega el aislamiento requerido antes de cargar Sparrow.</p></div><script>const row=(id,label,ok,extra='')=>{const el=document.getElementById(id);el.className=ok?'ok':'bad';el.innerHTML=`<b>${ok?'OK':'FALLA'} · ${label}</b>${extra?` — ${extra}`:''}`};row('iso','crossOriginIsolated',self.crossOriginIsolated===true,String(self.crossOriginIsolated));row('sab','SharedArrayBuffer',typeof SharedArrayBuffer!=='undefined',typeof SharedArrayBuffer);row('workers','Web Workers',typeof Worker!=='undefined',typeof Worker);</script></body></html>
